# version: "3.8"

networks:
  app-network:
    driver: bridge

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    command: flask run --host=0.0.0.0 --debugger --reload
    volumes:
      - .:/app
    env_file: .env
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery_worker:
    build:
      context: .
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: bash -c "celery -A app.make_celery worker --loglevel=debug --concurrency=4 >> /app/logs/celery.log 2>&1"
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - app-network

  redis:
    image: redis:7.4.1-bookworm
    container_name: ${REDIS_HOST}
    env_file: .env
    command: bash -c "redis-server --requirepass $$REDIS_PASSWORD --port ${REDIS_PORT}"
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - app-network

  db:
    image: postgres:13.16-bullseye
    restart: always
    container_name: ${DB_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    networks:
      - app-network

  weaviate_db:
    command: --host 0.0.0.0 --port 8000 --scheme http
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.10
    ports:
      - 8000:8000
      - 50051:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: always
    env_file: .env
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    networks:
      - app-network

volumes:
  postgresdata:
    external: false
  weaviate_data:
