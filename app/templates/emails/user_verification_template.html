<!DOCTYPE html>
<html>
  <head>
    <title>Mentoria - Account Verification</title>
  </head>
  <body>
    <table width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td
          background="https://img.freepik.com/free-photo/abstract-textured-backgound_1258-30461.jpg?t=st=1737063963~exp=1737067563~hmac=1ea34800e8608a95fe5032c9c4f0f440fe7caf6990e8efd0a325688e6bea939b&w=1380"
          style="
            background: url('https://img.freepik.com/free-photo/abstract-textured-backgound_1258-30461.jpg?t=st=1737063963~exp=1737067563~hmac=1ea34800e8608a95fe5032c9c4f0f440fe7caf6990e8efd0a325688e6bea939b&w=1380')
              no-repeat center center / cover;
            width: 100%;
            text-align: center;
          "
          valign="top"
        >
          <!-- Logo -->
          <table
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="background-color: #340e5a"
          >
            <tr>
              <td style="padding: 20px; text-align: center">
                <img
                  src="https://assets.zenn.com/blog/3c70455d-07f9-4c4e-960d-291d4046efd9.webp"
                  alt="Mentoria Logo"
                  style="height: 100px"
                />
              </td>
            </tr>
          </table>

          <!-- Title and Content -->
          <table
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="padding-top: 10%; padding-bottom: 10%"
          >
            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  color: white;
                  font-size: 32px;
                  font-family: Arial, sans-serif;
                "
              >
                Please verify your account
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  color: white;
                  font-size: 24px;
                  font-family: Arial, sans-serif;
                "
              >
                To verify your account, please visit this
                <a href="{{ url }}" style="color: #dcb0ff">URL</a>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px;
                  text-align: center;
                  color: gray;
                  font-size: 12px;
                  font-family: Arial, sans-serif;
                "
              >
                If you did not request this verification, please ignore this
                email.
              </td>
            </tr>
          </table>

          <!-- Footer -->
          <table
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              padding-top: 5%;
              padding-bottom: 5%;
              background-color: #340e5a;
            "
          >
            <tr>
              <td
                style="
                  padding: 0px;
                  text-align: center;
                  color: #c7a2db;
                  font-size: 20px;
                  font-family: Arial, sans-serif;
                "
              >
                <p style="margin: 0">
                  &copy; 2025 Mentoria. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
